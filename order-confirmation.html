<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed - Obya Orders</title>

    <link rel="stylesheet" href="css/customer/style.css?v=1">

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            OBYA ORDERS
        </div>

        <nav class="navigation">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#products">
                Shop
            </a>

            <a href="index.html#categories">
                Categories
            </a>

        </nav>

        <a href="cart.html" class="cart-button">
            🛒 Cart

            <span id="cart-count">
                0
            </span>

        </a>

    </header>



    <!-- CONFIRMATION -->

    <main class="cart-page">

        <div class="cart-heading">

            <p class="cart-eyebrow">
                OBYA ORDERS
            </p>

            <h1>
                Order Confirmed
            </h1>

            <p class="cart-subtitle">
                Thank you for your order.
            </p>

        </div>


        <div class="order-confirmation-card">

            <div class="confirmation-icon">
                ✓
            </div>

            <h2>
                Your order has been received
            </h2>

            <p>
                We will contact you shortly to confirm the order and delivery details.
            </p>


            <div class="confirmation-order-number">

                <span>
                    Order Number
                </span>

                <strong id="confirmation-order-number">
                    —
                </strong>

            </div>


            <a href="index.html" class="checkout-button confirmation-home-button">
                Continue Shopping
                <span>→</span>
            </a>

        </div>

    </main>



    <!-- FOOTER -->

    <footer class="footer">

        <div class="footer-logo">
            OBYA ORDERS
        </div>

        <p>
            © 2026 Obya Orders. All rights reserved.
        </p>

    </footer>

    <script>

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const orderNumber =
            urlParams.get("order");

        if (!orderNumber) {

            window.location.replace(
                "index.html"
            );

        }

        const orderNumberElement =
            document.getElementById(
                "confirmation-order-number"
            );

        if (orderNumberElement) {

            orderNumberElement.textContent =
                orderNumber || "—";

        }

    </script>

</body>

</html>
