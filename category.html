<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Category | Obya Orders</title>

    <link rel="stylesheet" href="css/customer/style.css?v=1">

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            OBYA ORDERS
        </div>


        <nav class="navigation">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#products">
                Shop
            </a>


            <div class="nav-dropdown">

                <button class="nav-dropdown-button" id="categories-menu-button" type="button">
                    Categories
                    <span>⌄</span>
                </button>

                <div class="nav-dropdown-menu" id="categories-dropdown">
                </div>

            </div>


            <a href="#">
                Contact
            </a>

        </nav>


        <a href="cart.html" class="cart-button">
            🛒 Cart

            <span id="cart-count">
                0
            </span>
        </a>

    </header>



    <!-- CATEGORY PAGE -->

    <main class="category-page">


        <div class="category-page-heading">

            <p>
                OBYA ORDERS
            </p>

            <h1 id="category-title">
                Category
            </h1>

        </div>



        <!-- SUBCATEGORIES -->

        <div class="subcategory-list" id="subcategory-list">
        </div>



        <!-- PRODUCTS -->

        <section class="products category-products">

            <div class="product-grid" id="category-product-grid">
            </div>


            <div class="category-empty" id="category-empty">

                <div class="category-empty-icon">
                    ♡
                </div>

                <h3>
                    Nothing here yet
                </h3>

                <p>
                    New products are coming soon.
                </p>

                <a href="index.html#categories" class="category-empty-button">
                    Explore Other Categories
                </a>

            </div>

        </section>


    </main>



    <!-- FOOTER -->

    <footer class="footer">

        <div class="footer-logo">
            OBYA ORDERS
        </div>

        <p>
            © 2026 Obya Orders. All rights reserved.
        </p>

    </footer>




    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/shared/supabase.js"></script>

    <script src="js/shared/categories.js?v=1"></script>
    <script src="js/shared/products.js?v=3"></script>

    <script src="js/shared/store-data.js?v=2"></script>

    <script>
        window.obyaStoreDataReady.then(
            function () {

                const script =
                    document.createElement(
                        "script"
                    );

                script.src =
                    "js/customer/category.js?v=1";

                document.body.appendChild(
                    script
                );

            }
        );
    </script>


</body>

</html>
