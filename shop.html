<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | Obya Orders</title>

    <link rel="stylesheet" href="css/customer/style.css?v=13">

</head>

<body>


    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            OBYA ORDERS
        </div>


        <nav class="navigation">

            <a href="index.html">
                Home
            </a>

            <a href="shop.html">
                Shop
            </a>


            <div class="nav-dropdown">

                <button class="nav-dropdown-button" id="categories-menu-button" type="button" aria-expanded="false">

                    <span class="nav-dropdown-label">
                        Categories
                    </span>

                    <span class="nav-dropdown-icon" aria-hidden="true">
                        <span></span>
                    </span>

                </button>

                <div class="nav-dropdown-menu" id="categories-dropdown">
                </div>

            </div>


            <a href="index.html">
                Contact
            </a>

        </nav>


        <a href="cart.html" class="cart-button">

            🛒 Cart

            <span id="cart-count">
                0
            </span>

        </a>

    </header>

    <!-- SHOP PAGE -->

    <main class="shop-page">

        <section class="products shop-products-page">

            <div class="shop-top-area">

                <!-- PAGE TITLE -->

                <div class="section-title">

                    <p>
                        OUR COLLECTION
                    </p>

                    <h2>
                        Shop
                    </h2>

                </div>


                <!-- CATEGORIES -->

                <div class="shop-category-options" id="shop-category-options">
                </div>


                <!-- SUBCATEGORIES -->

                <div class="shop-subcategory-options" id="shop-subcategory-options" hidden>
                </div>

            </div>


            <!-- PRODUCTS -->

            <div class="product-grid" id="shop-product-grid">
            </div>

        </section>

    </main>

    <!-- FOOTER -->

    <footer class="footer">

        <div class="footer-logo">
            OBYA ORDERS
        </div>

        <p>
            © 2026 Obya Orders. All rights reserved.
        </p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/shared/supabase.js"></script>

    <script src="js/shared/categories.js?v=1"></script>

    <script src="js/shared/products.js?v=3"></script>

    <script src="js/shared/store-data.js?v=6"></script>

    <script>
        window.obyaStoreDataReady.then(
            function () {

                const sharedScript =
                    document.createElement(
                        "script"
                    );

                sharedScript.src =
                    "js/customer/script.js?v=3";

                sharedScript.onload =
                    function () {

                        const shopScript =
                            document.createElement(
                                "script"
                            );

                        shopScript.src =
                            "js/customer/shop.js?v=2";

                        document.body.appendChild(
                            shopScript
                        );

                    };

                document.body.appendChild(
                    sharedScript
                );

            }
        );
    </script>


</body>

</html>
