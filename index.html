<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Obya Orders</title>

    <link rel="stylesheet" href="css/customer/style.css?v=1">

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            OBYA ORDERS
        </div>


        <nav class="navigation">

            <a href="#">
                Home
            </a>

            <a href="#products">
                Shop
            </a>

            <div class="nav-dropdown">

                <button class="nav-dropdown-button" id="categories-menu-button" type="button">
                    Categories
                    <span>⌄</span>
                </button>

                <div class="nav-dropdown-menu" id="categories-dropdown">
                </div>

            </div>

            <a href="#">
                Contact
            </a>

        </nav>


        <a href="cart.html" class="cart-button">

            🛒 Cart

            <span id="cart-count">
                0
            </span>

        </a>

    </header>



    <!-- HERO SECTION -->

    <section class="hero">

        <div class="hero-content">

            <p class="hero-small-title">
                WELCOME TO
            </p>

            <h1>
                Obya Orders
            </h1>

            <p class="hero-description">

                Discover our collection of carefully
                selected products, all in one place.

            </p>

            <button class="shop-button">

                Shop Now

            </button>

        </div>

    </section>



    <!-- CATEGORIES -->

    <section class="categories" id="categories">

        <div class="section-title">

            <p>
                EXPLORE
            </p>

            <h2>
                Shop by Category
            </h2>

        </div>

        <div class="category-grid" id="category-grid">
        </div>

    </section>



    <!-- FEATURED PRODUCTS -->

    <section class="products" id="products">

        <div class="section-title">

            <p>
                OUR COLLECTION
            </p>

            <h2>
                Featured Products
            </h2>

        </div>


        <!-- PRODUCTS ARE GENERATED BY script.js -->

        <div class="product-grid">
        </div>


    </section>



    <!-- FOOTER -->

    <footer class="footer">

        <div class="footer-logo">
            OBYA ORDERS
        </div>

        <p>
            © 2026 Obya Orders. All rights reserved.
        </p>

    </footer>



    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/shared/supabase.js"></script>
    <script src="js/shared/categories.js?v=1"></script>
    <script src="js/shared/products.js?v=3"></script>
    <script src="js/shared/store-data.js?v=2"></script>
    <script>
        window.obyaStoreDataReady.then(
            function () {

                const script =
                    document.createElement(
                        "script"
                    );

                script.src =
                    "js/customer/script.js?v=2";

                document.body.appendChild(
                    script
                );

            }
        );
    </script>


</body>

</html>
